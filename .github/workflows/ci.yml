name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # n8n-workflow (types-only devDependency) pulls in @n8n/expression-runtime,
      # which builds isolated-vm from source via node-gyp and fails on the runner.
      # Nothing here needs that native binary — typecheck, tests, eval and build
      # are all pure TypeScript — so skip install scripts.
      - run: npm ci --ignore-scripts
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Extraction eval (hermetic / replay fixtures)
        run: npm run eval
      - name: Build
        run: npm run build
